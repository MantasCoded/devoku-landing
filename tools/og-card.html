<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Devoku — social card</title>
  <style>
    @font-face {
      font-family: 'Funnel Sans';
      font-style: normal;
      font-weight: 300 800;
      src: url('../assets/fonts/funnel-sans-latin.woff2') format('woff2');
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      width: 1200px;
      height: 630px;
      display: grid;
      grid-template-rows: 1fr auto;
      padding: 72px 72px 64px;
      background: linear-gradient(160deg, #ededed 0%, #ffdec2 46%, #82d2a7 100%);
      font-family: 'Funnel Sans', sans-serif;
      color: #1c1c1c;
      overflow: hidden;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      font-size: 30px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #0a0a0a;
    }
    h1 {
      margin-top: 40px;
      font-size: 76px;
      line-height: 1.04;
      letter-spacing: -0.03em;
      font-weight: 500;
      max-width: 15ch;
    }
    p {
      margin-top: 24px;
      max-width: 34em;
      font-size: 24px;
      line-height: 1.45;
      color: #3d3d3d;
    }
    .foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: 'Funnel Sans', sans-serif;
      font-size: 17px;
      color: #3f3f3f;
    }
  </style>
</head>
<body>
  <div>
    <p class="logo-line" style="display:flex;align-items:center;gap:14px;font-size:28px;font-weight:600;letter-spacing:-0.02em;color:#0a0a0a">
      <svg width="30" height="30" viewBox="0 0 23 23" aria-hidden="true">
        <rect width="23" height="23" rx="5.5" fill="#0a0a0a"/>
        <rect x="2" y="3" width="6" height="4" rx="1" fill="#ef4444"/>
        <rect x="9" y="3" width="6" height="4" rx="1" fill="#f59e0b"/>
        <rect x="15" y="3" width="6" height="4" rx="1" fill="#22c55e"/>
        <rect x="5" y="8" width="6" height="4" rx="1" fill="#3b82f6"/>
        <rect x="12" y="8" width="6" height="4" rx="1" fill="#8b5cf6"/>
        <rect x="2" y="13" width="6" height="4" rx="1" fill="#ec4899"/>
        <rect x="9" y="13" width="6" height="4" rx="1" fill="#14b8a6"/>
        <rect x="15" y="13" width="6" height="4" rx="1" fill="#f97316"/>
        <rect x="5" y="18" width="6" height="4" rx="1" fill="#84cc16"/>
        <rect x="12" y="18" width="6" height="4" rx="1" fill="#06b6d4"/>
      </svg>
      Devoku
    </p>
    <h1>AI employees that do the work</h1>
    <p>Send tasks the moment you think of them. Your AI team works in parallel, right in your environment.</p>
  </div>
  <div class="foot">
    <span>devoku.com</span>
    <span>AI employees · teams · your environment</span>
  </div>
</body>
</html>
